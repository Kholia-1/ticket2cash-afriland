spring.application.name=ticket2cash
spring.profiles.default=dev
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

server.port=${PORT:3000}

# Base H2 en mémoire pour le MVP
# Keep the local H2 database relative to the project instead of using the
# previous developer's absolute Windows path.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/ticket2cashdb}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Encodage
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
# Loyalty batch uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

ocr.server.url=${OCR_SERVER_URL:http://localhost:5001/ocr}
