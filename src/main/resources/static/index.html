      <div class="tab" data-inboxtab="CLOSED" onclick="inboxSwitch('CLOSED')">Fermées</div>
    </div>
    <div class="table-wrap"><div class="table-toolbar"><span class="count-pill" id="inboxCp">—"</span></div>
    <div class="table-scroll"><table><thead><tr><th>Commerçant</th><th>Sujet</th><th>Type</th><th>Statut</th><th>Reçue le</th><th style="text-align:right">Actions</th></tr></thead>
    <tbody id="inboxBody">${rowSkeleton(6,6)}</tbody></table></div></div></div>`;
  try{
    let rows=await api("/api/partner-requests");
    if(!Array.isArray(rows)) rows=[];
    window.__inbox=rows;
    inboxSwitch("all");
  }catch(e){ document.getElementById("inboxBody").innerHTML=`<tr><td colspan="6">${emptyMini(t("err_load"))}</td></tr>`; }
}

function inboxSwitch(filter){
  document.querySelectorAll("[data-inboxtab]").forEach(t=>t.classList.toggle("active", t.dataset.inboxtab===filter));
  const rows=(window.__inbox||[]).filter(r => filter==="all" || r.status===filter);
  document.getElementById("inboxCp").textContent = rows.length + " demande(s)";
  document.getElementById("inboxBody").innerHTML = rows.length ? rows.map(r=>`
    <tr>
      <td class="strong">${esc(r.merchantName||"—")}</td>
      <td>${esc(r.subject||"—")}</td>
      <td>${reqTypeBadge(r.type)}</td>
      <td>${reqStatusBadge(r.status)}</td>
      <td style="color:var(--text-2);font-size:12px;white-space:nowrap">${dt(r.createdAt)}</td>
      <td class="row-actions">
        <button class="mini-btn" onclick="reqView(${r.id})">Voir</button>
        ${r.status!=="RESPONDED"&&r.status!=="CLOSED"?`<button class="mini-btn" onclick="reqRespond(${r.id})">Répondre</button>`:""}
      </td>
    </tr>`).join("") : `<tr><td colspan="6">${emptyFull()}</td></tr>`;
}

function reqTypeBadge(t){
  const map={
    CAMPAIGN_REQUEST:{icon:"•",label:"Campagne",cls:"b-info"},
    QUESTION:{icon:"•",label:"Question",cls:"b-ok"},
    SUPPORT:{icon:"•",label:"Support",cls:"b-warn"},
    OTHER:{icon:"•",label:"Autre",cls:"b-muted"}
  };
  const m=map[t]||map.OTHER;
  return `<span class="badge ${m.cls}">${m.icon} ${m.label}</span>`;
}

function reqStatusBadge(s){
  const map={
    OPEN:{label:"Nouvelle",cls:"b-info"},
    IN_PROGRESS:{label:"En cours",cls:"b-warn"},
    RESPONDED:{label:"Répondue",cls:"b-ok"},
    CLOSED:{label:"Fermée",cls:"b-muted"}
  };
  const m=map[s]||{label:s,cls:"b-muted"};
  return `<span class="badge ${m.cls}">${m.label}</span>`;
}

function reqModal(presetType){
  const types = [
    {code:"CAMPAIGN_REQUEST", icon:"•", label:"Demander une campagne", desc:"Vous voulez qu'Afriland crée une campagne cashback pour votre boutique."},
    {code:"QUESTION", icon:"•", label:"Poser une question", desc:"Vous avez besoin d'une information sur la plateforme."},
    {code:"SUPPORT", icon:"•", label:"Signaler un problème", desc:"Quelque chose ne fonctionne pas comme prévu."},
    {code:"OTHER", icon:"•", label:"Autre", desc:"Toute autre communication."}
  ];
  const selected = presetType || "CAMPAIGN_REQUEST";
  const body = `
    <div style="margin-bottom:14px;padding:10px 14px;background:var(--surface-2);border-radius:8px;font-size:13px;color:var(--text-2)">
      Envoyez un message à l'équipe Afriland. Vous verrez leur réponse dans cet onglet.
    </div>
    <div class="form-grid">
      <div class="field full">
        <label>Type de demande *</label>
        <select id="req_type">
          ${types.map(t=>`<option value="${t.code}" ${t.code===selected?"selected":""}>${t.icon} ${t.label}</option>`).join("")}
        </select>
      </div>
      <div class="field full">
        <label>Sujet *</label>
        <input id="req_subject" data-validate="name" placeholder="Ex: Campagne rentrée scolaire 2026" maxlength="200">
        <div class="field-error"></div>
      </div>
      <div class="field full">
        <label>Message détaillé *</label>
        <textarea id="req_message" rows="8" placeholder="Décrivez précisément votre demande. Pour une campagne : période souhaitée, produits/catégories, pourcentage envisagé, etc." style="width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--input-bg);color:var(--text);font-size:14px;font-family:inherit;resize:vertical" maxlength="4000"></textarea>
        <div class="field-error"></div>
        <div id="req_msgcount" style="font-size:11px;color:var(--muted);margin-top:4px;text-align:right">0 / 4000</div>
      </div>
    </div>`;
  openModal("Nouvelle demande à Afriland", body,
    `<button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
     <button class="btn btn-primary" onclick="reqSend()">Envoyer</button>`);
  setTimeout(()=>{
    wireLiveValidation("#modalBack");
    // Live-count message
    const msg=document.getElementById("req_message"), count=document.getElementById("req_msgcount");
    if(msg && count){
      const update=()=>{ count.textContent=msg.value.length+" / 4000"; };
      msg.addEventListener("input", update);
      msg.addEventListener("input", ()=>{
        if(msg.value.trim().length<5){
          msg.classList.add("invalid");
          const e=msg.parentElement.querySelector(".field-error");
          if(e){ e.textContent="Au moins 5 caractères"; e.classList.add("show"); }
        } else {
          msg.classList.remove("invalid");
          const e=msg.parentElement.querySelector(".field-error");
          if(e){ e.classList.remove("show"); }
        }
      });
    }
  }, 50);
}

async function reqSend(){
  const subj=val("req_subject");
  const msg=document.getElementById("req_message").value.trim();
  const type=document.getElementById("req_type").value;
  if(!subj || subj.length<2){ toast("Sujet requis (2 caractères min)","err"); return; }
  if(msg.length<5){ toast("Message requis (5 caractères min)","err"); return; }
  try{
    await api("/api/partner-requests",{method:"POST",body:JSON.stringify({subject:subj,message:msg,type})});
    toast("Demande envoyée à Afriland","ok");
    closeModal();
    if(typeof CURRENT!=="undefined" && CURRENT==="partnerRequests") renderPartnerRequests();
  }catch(e){
    let m=String(e.message||e);
    try{ const j=JSON.parse(m); if(j.error) m=j.error; }catch(_){}
    toast(m.slice(0,200),"err");
  }
}

async function reqView(id){
  try{
    const r=await api("/api/partner-requests/"+id);
    if(!r) return;
    const isAdmin=ME.role==="ADMIN";
    const responseBlock = r.adminResponse
      ? `<div style="margin-top:16px;padding:14px;background:var(--surface-2);border-radius:10px;border-left:4px solid var(--ok)">
          <div style="font-size:12px;color:var(--muted);margin-bottom:6px">Réponse d'Afriland — ${esc(r.responderUsername||"admin")} · ${dt(r.respondedAt)}</div>
          <div style="white-space:pre-wrap;font-size:14px;line-height:1.5">${esc(r.adminResponse)}</div>
        </div>`
      : `<div style="margin-top:16px;padding:14px;background:var(--surface-2);border-radius:10px;color:var(--muted);font-size:13px">Pas encore de réponse d'Afriland.</div>`;
    const body=`
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
        <div><span style="color:var(--muted);font-size:11px">Commerçant</span><br><strong>${esc(r.merchantName||"—")}</strong></div>
        <div><span style="color:var(--muted);font-size:11px">Envoyée par</span><br>${esc(r.senderUsername||"—")}</div>
        <div><span style="color:var(--muted);font-size:11px">Type</span><br>${reqTypeBadge(r.type)}</div>
        <div><span style="color:var(--muted);font-size:11px">Statut</span><br>${reqStatusBadge(r.status)}</div>
        <div style="grid-column:1/-1"><span style="color:var(--muted);font-size:11px">Reçue le</span><br>${dt(r.createdAt)}</div>
      </div>
      <div><span style="color:var(--muted);font-size:11px">Sujet</span></div>
      <h3 style="margin:4px 0 12px 0;font-size:16px">${esc(r.subject||"—")}</h3>
      <div style="padding:14px;background:var(--surface-2);border-radius:10px;white-space:pre-wrap;font-size:14px;line-height:1.5">${esc(r.message||"")}</div>
      ${responseBlock}`;
    let footer = `<button class="btn btn-ghost" onclick="closeModal()">Fermer</button>`;
    if(isAdmin){
      footer += ` <button class="btn btn-primary" onclick="reqRespond(${r.id})">Répondre</button>`;
      if(r.status!=="CLOSED"){
        footer += ` <button class="btn btn-ghost" onclick="reqSetStatus(${r.id},'CLOSED')">Fermer la demande</button>`;
      }
    }
    openModal("Demande "+r.id, body, footer);
  }catch(e){ toast("Erreur: "+e.message,"err"); }
}

function reqRespond(id){
  const body=`
    <div class="form-grid">
      <div class="field full">
        <label>Votre réponse au partenaire *</label>
        <textarea id="req_response" rows="10" style="width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--input-bg);color:var(--text);font-size:14px;font-family:inherit;resize:vertical" placeholder="Rédigez la réponse qui sera envoyée au partenaire." maxlength="4000"></textarea>
        <div class="field-error"></div>
      </div>
    </div>`;
  openModal("Répondre à la demande #"+id, body,
    `<button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
     <button class="btn btn-primary" onclick="reqSendResponse(${id})">Envoyer la réponse</button>`);
}

async function reqSendResponse(id){
  const response=document.getElementById("req_response").value.trim();
  if(response.length<3){ toast("Réponse trop courte","err"); return; }
  try{
    await api("/api/partner-requests/"+id+"/respond",{method:"POST",body:JSON.stringify({response})});
    toast("Réponse envoyée","ok");
    closeModal();
    if(typeof CURRENT!=="undefined" && CURRENT==="adminInbox") renderAdminInbox();
  }catch(e){ toast(String(e.message||e).slice(0,200),"err"); }
}

async function reqSetStatus(id,status){
  if(!confirm(`Passer cette demande au statut ${status} ?`)) return;
  try{
    await api(`/api/partner-requests/${id}/status?status=${status}`,{method:"PUT"});
    toast("Statut mis à jour","ok");
    closeModal();
    if(typeof CURRENT!=="undefined" && CURRENT==="adminInbox") renderAdminInbox();
  }catch(e){ toast(String(e.message||e).slice(0,200),"err"); }
}

async function renderSubPartners(){
  const c=document.getElementById("content");
  c.innerHTML=`<div class="page">${head(t("subPartners"),t("sub_sub"),`<button class="btn btn-primary" onclick="subPartnerModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>${t("new_subpartner")}</button>`+refreshBtn())}
    ${partnerContextPanel("subPartners")}
    <div class="table-wrap"><div class="table-toolbar"><span class="count-pill" id="spCp">—"</span></div>
    <div class="table-scroll"><table><thead><tr><th>${t("m_name")}</th><th>${t("m_city")}</th><th>${t("m_phone")}</th><th>${t("m_status")}</th><th>${t("c_created")}</th><th style="text-align:right">${t("col_actions")}</th></tr></thead>
    <tbody id="spBody">${rowSkeleton(6,5)}</tbody></table></div></div></div>`;
  try{let rows=await api("/api/partner/sub-merchants");if(!Array.isArray(rows))rows=[];
    document.getElementById("spCp").textContent=rows.length+" "+t("items");
    document.getElementById("spBody").innerHTML=rows.length?rows.map(m=>{const nm=(m.name||m.brandName||"").replace(/'/g,"’");return `<tr><td class="strong">${esc(m.name||m.brandName)}</td><td>${esc(m.city||"—")}</td><td><span class="mono">${esc(m.phone||"—")}</span></td><td>${badge(m.status)}</td><td style="color:var(--text-2)">${dt(m.createdAt)}</td><td class="row-actions"><button class="mini-btn" onclick="subUserModal(${m.id},'${esc(nm)}')">${t("sp_access")}</button><button class="mini-btn danger" onclick="delSubPartner(${m.id},'${esc(nm)}')">${t("del")}</button></td></tr>`;}).join(""):`<tr><td colspan="6">${emptyFull()}</td></tr>`;
  }catch(e){document.getElementById("spBody").innerHTML=`<tr><td colspan="6">${emptyMini(t("err_load"))}</td></tr>`;}
}
function subPartnerModal(){
  openModal(t("new_subpartner"),
    merchantFormFields(null,{hideParent:true})+
    `<div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 10px">${t("sp_login_section")}</div>
     <div class="form-grid">
       <div class="field"><label>${t("cp_username")}</label><input id="sp_username" placeholder="ex: orange-cm"></div>
        <div class="field full"><label>${t("cp_password")}</label><div style="display:flex;gap:8px"><input id="sp_password" type="password" autocomplete="new-password"><button type="button" class="btn btn-ghost" onclick="fillPw('sp_password')">${t("cp_generate")}</button></div><div class="hint">${t("pw_hint")}</div></div>
     </div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">${t("cancel")}</button><button class="btn btn-primary" onclick="submitSubPartner()">${t("save")}</button>`);
}
async function submitSubPartner(){
  const body=merchantBody();
  if(!body.name){toast(t("m_name"),"err");return;}
  const username=val("sp_username"),password=val("sp_password");
  if((username||password)&&(!username||password.length<8||!/[0-9]/.test(password))){toast(t("pw_hint"),"err");return;}
  try{
    const sub=await api("/api/partner/sub-merchants",{method:"POST",body:JSON.stringify(body)});
    if(username&&password){
      const subId=sub&&sub.id;
      const res=await api(`/api/partner/sub-merchants/${subId}/user`,{method:"POST",body:JSON.stringify({username:username,password:password,fullName:body.name,email:body.email,loginUrl:effectiveBase()+"/login.html"})});
      closeModal();
      showPartnerCredentials(body.name,username,password,{email:body.email,emailSent:res&&res.emailSent});
    }else{toast(t("merchant_created"),"ok");closeModal();renderSubPartners();}
  }catch(e){toast(String(e.message||e).slice(0,160),"err");}
}
function subUserModal(subId,name){
  openModal(t("sp_access_title")+" "+name,
    `<div class="form-grid">
       <div class="field"><label>${t("cp_username")}</label><input id="su_username"></div>
       <div class="field full"><label>${t("cp_password")}</label><div style="display:flex;gap:8px"><input id="su_password" type="password" autocomplete="new-password"><button type="button" class="btn btn-ghost" onclick="fillPw('su_password')">${t("cp_generate")}</button></div><div class="hint">${t("pw_hint")}</div></div>
     </div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">${t("cancel")}</button><button class="btn btn-primary" onclick="submitSubUser(${subId},'${esc(name)}')">${t("save")}</button>`);
}
async function submitSubUser(subId,name){
  const username=val("su_username"),password=val("su_password");
  if(!username||password.length<8||!/[0-9]/.test(password)){toast(t("pw_hint"),"err");return;}
  try{const res=await api(`/api/partner/sub-merchants/${subId}/user`,{method:"POST",body:JSON.stringify({username:username,password:password,fullName:name,loginUrl:effectiveBase()+"/login.html"})});
    showPartnerCredentials(name,username,password,{email:res&&res.email,emailSent:res&&res.emailSent});
  }catch(e){toast(String(e.message||e).slice(0,160),"err");}
}
async function delSubPartner(id,name){
  if(!confirm(t("sp_del_confirm")+"\n\n"+name))return;
  try{await api(`/api/partner/sub-merchants/${id}`,{method:"DELETE"});toast(t("sp_deleted"),"ok");renderSubPartners();}
  catch(e){toast(String(e.message||e).slice(0,140),"err");}
}

/* ============ SKELETON / EMPTY ============ */
function kpiSkeletons(n){return Array(n).fill(`<div class="kpi"><div class="sk sk-line" style="width:60%"></div><div class="sk" style="height:30px;width:50%;margin:10px 0"></div><div class="sk sk-line" style="width:40%"></div></div>`).join("");}
function skLines(n){return Array(n).fill('<div class="sk sk-line"></div>').join("");}
function rowSkeleton(cols,rows){return Array(rows).fill(`<tr>${Array(cols).fill('<td><div class="sk sk-line"></div></td>').join("")}</tr>`).join("");}
function emptyFull(){return `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v16"/></svg><h4>${t("empty")}</h4><p>${t("empty_sub")}</p></div>`;}
function emptyMini(msg){return `<div class="empty" style="padding:30px 10px"><p>${esc(msg)}</p></div>`;}

/* ============ INTERACTIONS ============ */
function animateCounters(){
  document.querySelectorAll("[data-count]").forEach(el=>{
    const target=Number(el.dataset.count);if(!target)return;
    const suf=el.dataset.suffix||"",dur=800,t0=performance.now();
    function step(now){const p=Math.min((now-t0)/dur,1),ease=1-Math.pow(1-p,3),val=Math.round(target*ease);el.textContent=nf.format(val)+(suf?(" "+suf):"");if(p<1)requestAnimationFrame(step);}
    el.textContent="0"+(suf?(" "+suf):"");requestAnimationFrame(step);
  });
}
function tableSearch(q){q=q.trim().toLowerCase();const tb=document.getElementById("tbody");if(!tb)return;tb.querySelectorAll("tr").forEach(tr=>{tr.style.display=tr.textContent.toLowerCase().includes(q)?"":"none";});}
function filterNav(q){q=q.trim().toLowerCase();let firstMatch=null;document.querySelectorAll(".nav-item").forEach(n=>{n.style.display=n.dataset.label.toLowerCase().includes(q)?"":"none";});document.querySelectorAll("[data-group]").forEach(g=>{const any=[...g.querySelectorAll(".nav-item")].some(n=>n.style.display!=="none");g.style.display=any?"":"none";if(q&&any&&!firstMatch)firstMatch=g;});if(q&&firstMatch){document.querySelectorAll("[data-group-key]").forEach(g=>g.classList.add("is-closed"));firstMatch.classList.remove("is-closed");}if(!q){document.querySelectorAll(".nav-item").forEach(n=>n.style.display="");buildNav(ME.role||"DEFAULT");}}
function toggleTheme(){const cur=document.documentElement.getAttribute("data-theme"),next=cur==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",next);localStorage.setItem("t2c_theme",next);updateThemeIcon();}
function updateThemeIcon(){const dark=document.documentElement.getAttribute("data-theme")==="dark";document.getElementById("themeBtn").innerHTML=dark?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';}
function setLang(l){LANG=l;localStorage.setItem("t2c_lang",l);document.documentElement.lang=l;applyI18n();buildNav(ME.role||"DEFAULT");go(CURRENT,true);}
function applyI18n(){
  document.getElementById("logoutTxt").textContent=t("logout");
  document.getElementById("navSearch").placeholder=t("search_menu");
  document.getElementById("globalSearch").placeholder=t("search_page");
  if(ME){document.getElementById("sideRole").textContent=stLabel(ME.role);document.getElementById("tbRole").textContent=stLabel(ME.role);}
  updateDate();
}
function updateDate(){const d=new Date();document.getElementById("dateMain").textContent=d.toLocaleDateString(LANG==="fr"?"fr-FR":"en-US",{weekday:"long",day:"numeric",month:"long"});document.getElementById("dateSub").textContent=d.getFullYear();}
function openNav(){document.body.classList.add("nav-open");}
function closeNav(){document.body.classList.remove("nav-open");}
async function logout(){try{await api("/api/auth/logout",{method:"POST"});}catch(e){}location.href="/login.html";}
function toast(msg,type){const el=document.createElement("div");el.className="toast "+(type||"");el.textContent=msg;document.body.appendChild(el);setTimeout(()=>{el.style.opacity="0";el.style.transition="opacity .3s";setTimeout(()=>el.remove(),300);},3200);}
window.addEventListener("hashchange",()=>{const id=location.hash.slice(1);if(id&&id!==CURRENT)go(id,true);});
boot();
</script>
</body>
</html>
