<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ticket2Cash — Afriland First Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --brand:#C1121F; --brand-600:#A50F1A; --brand-700:#8A0C15; --brand-tint:#FDECEE;
  --font-sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --font-display:'Plus Jakarta Sans',var(--font-sans);
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --sidebar-w:266px; --topbar-h:64px;
  --ok:#127A45; --ok-bg:#E6F4EC;
  --warn:#B25E09; --warn-bg:#FBEFDD;
  --info:#1553B8; --info-bg:#E7F0FE;
  --danger:#B42318; --danger-bg:#FCE9E7;
  --muted-badge:#5A6472; --muted-bg:#EEF1F5;
}
/* ---------- LIGHT: whole shell light ---------- */
html[data-theme="light"]{
  --bg:#F4F6FA; --bg-grad:radial-gradient(1100px 480px at 82% -12%, #fbe9ea 0%, transparent 62%);
  --surface:#FFFFFF; --surface-2:#F7F9FC; --elevated:#FFFFFF;
  --border:#E6EAF1; --border-strong:#D6DCE7;
  --text:#101828; --text-2:#48566B; --muted:#8A94A6;
  /* sidebar = light */
  --side-bg:#FFFFFF; --side-text:#48566B; --side-strong:#101828; --side-muted:#98A2B3;
  --side-hover:#F2F5FA; --side-border:#E6EAF1;
  --logo-chip:#FFFFFF; --logo-border:#E6EAF1;
  --logout-bg:#FDECEE; --logout-text:#B42318; --logout-border:#F6CDD1;
  --input-bg:#FFFFFF;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow-md:0 4px 16px rgba(16,24,40,.08);
  --shadow-lg:0 12px 40px rgba(16,24,40,.14);
}
/* ---------- DARK: whole shell dark ---------- */
html[data-theme="dark"]{
  --bg:#090C12; --bg-grad:radial-gradient(1100px 480px at 82% -12%, rgba(193,18,31,.15) 0%, transparent 62%);
  --surface:#12161F; --surface-2:#161C27; --elevated:#161C27;
  --border:#232B39; --border-strong:#2C3648;
  --text:#E9EDF5; --text-2:#AEB7C6; --muted:#727D90;
  /* sidebar = dark */
  --side-bg:#0D121A; --side-text:#AEB7C6; --side-strong:#F1F4FA; --side-muted:#6B7688;
  --side-hover:rgba(255,255,255,.05); --side-border:#1E2531;
  --logo-chip:#FFFFFF; --logo-border:#2A3342;
  --logout-bg:rgba(193,18,31,.16); --logout-text:#FF8F96; --logout-border:rgba(193,18,31,.28);
  --input-bg:#0E1219;
  --ok-bg:#0e2a1c; --warn-bg:#2c1f0d; --info-bg:#0f1f3a; --danger-bg:#2c1512; --muted-bg:#1a2130;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 4px 16px rgba(0,0,0,.4);
  --shadow-lg:0 16px 46px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-sans);background:var(--bg);background-image:var(--bg-grad);
  background-attachment:fixed;color:var(--text);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;transition:background-color .3s ease,color .3s ease;
}
/* global smooth theme transition */
.sidebar,.topbar,.panel,.kpi,.table-wrap,.nav-item,.btn,input,select,.badge,thead th,tbody td{
  transition:background-color .3s ease,color .3s ease,border-color .3s ease,box-shadow .3s ease;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:14px}
::selection{background:var(--brand-tint);color:var(--brand-700)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:20px;border:3px solid transparent;background-clip:padding-box}

/* ============ LAYOUT ============ */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
.sidebar{
  background:var(--side-bg);color:var(--side-text);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;z-index:60;border-right:1px solid var(--side-border);
}
.main{min-width:0;display:flex;flex-direction:column}

/* ---- Brand / logo (Afriland only) ---- */
.brand-box{padding:22px 18px 16px;display:flex;align-items:center;justify-content:center}
.brand-logo{display:flex;align-items:center;justify-content:center;width:100%;min-height:78px}
.brand-logo img{height:72px;max-width:100%;object-fit:contain;transition:filter .18s ease}
/* Light sidebar -> original logo. Dark sidebar -> white logo (same trick as the login page). */
html[data-theme="dark"] .brand-logo img{filter:brightness(0) invert(1)}
.brand-logo .fallback{font-family:var(--font-display);font-weight:800;color:var(--brand);font-size:20px;text-align:center;line-height:1.15}
html[data-theme="dark"] .brand-logo .fallback{color:#fff}
.logo-divider{height:1px;background:var(--side-border);margin:2px 16px 10px}

/* ---- Sidebar search ---- */
.side-search{padding:0 14px 12px;position:relative}
.side-search svg{position:absolute;left:26px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--side-muted)}
.side-search input{
  width:100%;background:var(--side-hover);border:1px solid var(--side-border);color:var(--side-strong);
  border-radius:10px;padding:9px 12px 9px 34px;font-size:13px
}
.side-search input::placeholder{color:var(--side-muted)}
.side-search input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-tint)}
html[data-theme="dark"] .side-search input:focus{box-shadow:0 0 0 3px rgba(193,18,31,.14)}

/* ---- Nav ---- */
.nav{flex:1;overflow-y:auto;padding:4px 10px 10px}
.nav::-webkit-scrollbar{width:6px}
.nav::-webkit-scrollbar-thumb{background:var(--border-strong)}
.nav-group{margin-top:14px}
.nav-group h4{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--side-muted);font-weight:700;padding:0 12px 6px}
.nav-group-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;border:0;background:transparent;color:var(--side-muted);font:inherit;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;padding:8px 12px 4px;cursor:pointer;text-align:left}
.nav-group-toggle:hover{color:var(--side-strong)}
.nav-group-toggle .chevron{font-size:13px;letter-spacing:0;transition:transform .18s ease}
.nav-group.is-closed .chevron{transform:rotate(-90deg)}
.nav-group.is-closed .nav-group-items{display:none}
.nav-group-desc{padding:0 12px 7px;color:var(--side-muted);font-size:10px;line-height:1.35}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--side-text);
  font-size:13.5px;font-weight:500;margin-bottom:1px;position:relative;cursor:pointer
}
.nav-item svg{width:18px;height:18px;flex:0 0 18px;opacity:.8}
.nav-item:hover{background:var(--side-hover);color:var(--side-strong)}
.nav-item.active{background:linear-gradient(90deg,var(--brand) 0%,var(--brand-600) 100%);color:#fff;box-shadow:0 6px 16px rgba(193,18,31,.32)}
.nav-item.active svg{opacity:1}

/* ---- Sidebar footer ---- */
.side-footer{padding:12px 14px 16px;border-top:1px solid var(--side-border)}
.side-footer .profile{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer}
.side-footer .profile:hover{background:var(--side-hover)}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--brand),#f2545b);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:0 0 34px}
.side-footer .who{min-width:0}
.side-footer .who b{display:block;font-size:13px;color:var(--side-strong);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-footer .who small{color:var(--side-muted);font-size:11px}
.btn-logout{width:100%;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px;border-radius:10px;background:var(--logout-bg);color:var(--logout-text);font-size:13px;font-weight:600;border:1px solid var(--logout-border)}
.btn-logout:hover{background:var(--brand);color:#fff;border-color:transparent}

/* ============ TOPBAR ============ */
.topbar{
  height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:16px;padding:0 20px;position:sticky;top:0;z-index:40
}
.hamburger{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--border);align-items:center;justify-content:center;flex:0 0 38px;color:var(--text)}
.hamburger:hover{background:var(--surface-2)}
.tb-brand{font-family:var(--font-display);font-weight:800;font-size:17px;letter-spacing:-.02em;color:var(--text);white-space:nowrap}
.tb-brand span{color:var(--brand)}
.tb-role{font-size:12px;font-weight:600;color:var(--brand-700);background:var(--brand-tint);padding:3px 10px;border-radius:20px;white-space:nowrap}
html[data-theme="dark"] .tb-role{background:rgba(193,18,31,.18);color:#ff9ba1}
.tb-search{flex:1;max-width:440px;position:relative;min-width:0}
.tb-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.tb-search input{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:10px 12px 10px 38px;color:var(--text)}
.tb-search input::placeholder{color:var(--muted)}
.tb-search input:focus{border-color:var(--brand);background:var(--surface);outline:none;box-shadow:0 0 0 4px var(--brand-tint)}
html[data-theme="dark"] .tb-search input:focus{box-shadow:0 0 0 4px rgba(193,18,31,.16)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.tb-date{font-size:11.5px;color:var(--text-2);text-align:right;line-height:1.25;white-space:nowrap}
.tb-date b{display:block;color:var(--text);font-weight:600;text-transform:capitalize}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--text-2);border:1px solid transparent;position:relative}
.icon-btn:hover{background:var(--surface-2);color:var(--text);border-color:var(--border)}
.icon-btn svg{width:19px;height:19px}
.icon-btn .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;background:var(--brand);border-radius:50%;border:2px solid var(--surface)}
.lang-sel{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:8px 10px;color:var(--text);font-size:12.5px;font-weight:500}

/* ============ CONTENT ============ */
.content{padding:24px 28px 40px;flex:1}
.page-head{margin-bottom:22px}
.page-head h1{font-family:var(--font-display);font-size:26px;font-weight:800;letter-spacing:-.02em}
.page-head p{color:var(--text-2);font-size:14px;margin-top:4px}
.page-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;font-size:13.5px;font-weight:600;border:1px solid transparent}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(193,18,31,.28)}
.btn-primary:hover{background:var(--brand-600)}
.btn-ghost{background:var(--surface);border-color:var(--border);color:var(--text)}
.btn-ghost:hover{background:var(--surface-2);border-color:var(--border-strong)}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;position:relative;overflow:hidden;box-shadow:var(--shadow-sm)}
.kpi::before{content:none}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--border-strong);transition:transform .18s,box-shadow .18s}
.kpi .kpi-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;gap:10px}
.kpi .kpi-icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--brand-tint);color:var(--brand);flex:0 0 38px}
html[data-theme="dark"] .kpi .kpi-icon{background:rgba(193,18,31,.16)}
.kpi .kpi-icon svg{width:20px;height:20px}
.kpi .kpi-label{font-size:12.5px;color:var(--text-2);font-weight:500}
.kpi .kpi-val{font-family:var(--font-display);font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin-top:6px}
.kpi .kpi-sub{font-size:12px;color:var(--muted);margin-top:8px}

.grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:22px}
.grid-3{display:grid;grid-template-columns:minmax(240px,2fr) repeat(5,minmax(120px,1fr));gap:14px;margin-bottom:4px}
.grid-3 label{display:block;margin-bottom:6px;font-size:12px;color:var(--text-2);font-weight:600}
.grid-3 input,.grid-3 select{width:100%;min-width:0;box-sizing:border-box}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border)}
.panel-head h3{font-family:var(--font-display);font-size:15px;font-weight:700}
.panel-head .link{font-size:12.5px;color:var(--brand);font-weight:600;cursor:pointer}
.panel-body{padding:16px 18px}

.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-sm)}
.table-toolbar{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.table-toolbar .count-pill{font-size:12px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);padding:4px 11px;border-radius:20px;font-weight:600}
.transactions-table th:first-child,.transactions-table td:first-child{position:sticky;left:0;z-index:2;background:var(--surface);box-shadow:4px 0 8px rgba(0,0,0,.06);white-space:nowrap}
.transactions-table th:first-child{z-index:3}
.transactions-table{min-width:920px}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
thead th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:12px 18px;background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:13px 18px;border-bottom:1px solid var(--border);font-size:13.5px;color:var(--text);vertical-align:middle}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:none}
td .mono{font-family:var(--font-mono);font-size:12.5px;color:var(--text-2)}
td .strong{font-weight:600}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{color:var(--ok);background:var(--ok-bg)} .b-warn{color:var(--warn);background:var(--warn-bg)}
.b-info{color:var(--info);background:var(--info-bg)} .b-danger{color:var(--danger);background:var(--danger-bg)}
.b-muted{color:var(--muted-badge);background:var(--muted-bg)}

.legend{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.legend .row{display:flex;align-items:center;gap:9px;font-size:13px}
.legend .row .sw{width:10px;height:10px;border-radius:3px}
.legend .row b{margin-left:auto;font-weight:700}

.sk{background:linear-gradient(90deg,var(--surface-2) 25%,var(--border) 37%,var(--surface-2) 63%);background-size:400% 100%;animation:sh 1.3s infinite;border-radius:6px}
@keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
.sk-line{height:12px;margin:8px 0}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.page{animation:fadeUp .3s ease both}
.empty{padding:52px 24px;text-align:center;color:var(--muted)}
.empty svg{width:44px;height:44px;margin-bottom:12px;opacity:.5}
.empty h4{font-size:15px;color:var(--text);font-weight:700;margin-bottom:5px}
.empty p{font-size:13px;max-width:340px;margin:0 auto}

.profile-card{max-width:640px}
.pf-row{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border)}
.pf-row:last-child{border:none}
.pf-row .k{color:var(--text-2);font-size:13.5px}
.pf-row .v{font-weight:600;font-family:var(--font-mono);font-size:13px}

.overlay{display:none;position:fixed;inset:0;background:rgba(4,4,8,.5);z-index:55;backdrop-filter:blur(2px)}
.toast{position:fixed;bottom:24px;right:24px;background:var(--elevated);border:1px solid var(--border);box-shadow:var(--shadow-lg);border-radius:12px;padding:13px 16px;font-size:13.5px;font-weight:500;z-index:100;animation:fadeUp .25s;max-width:340px;color:var(--text)}
.toast.err{border-left:3px solid var(--brand)} .toast.ok{border-left:3px solid var(--ok)}
.tree-toggle{display:inline-flex;width:18px;height:18px;align-items:center;justify-content:center;margin-right:8px;transition:transform .15s;color:var(--muted);vertical-align:middle}
.partner-row{cursor:pointer}
.partner-row.open .tree-toggle{transform:rotate(90deg)}
.partner-row:hover{background:var(--surface-2)}
.child-row{display:none}
.child-row.show{display:table-row}
.child-row td:first-child{padding-left:46px;color:var(--text-2)}
.cred-box{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.cred-box .k{font-size:12px;color:var(--muted);font-weight:600}
.cred-box .v{font-family:var(--font-mono);font-weight:600;font-size:14px;word-break:break-all}

/* ---- avatar image ---- */
.avatar img,.avatar-lg img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.avatar-lg{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--brand),#f2545b);display:grid;place-items:center;color:#fff;font-weight:800;font-size:30px;overflow:hidden;flex:0 0 84px;position:relative}
.tb-avatar{width:38px;height:38px;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,var(--brand),#f2545b);display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;cursor:pointer;border:2px solid var(--border)}
/* ---- tabs ---- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:22px;flex-wrap:wrap}
.tab{padding:10px 16px;font-size:13.5px;font-weight:600;color:var(--text-2);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--brand);border-bottom-color:var(--brand)}
/* --- Field validation feedback (V7) --- */
.field input.invalid,
.field select.invalid,
.field textarea.invalid,
input.invalid, select.invalid, textarea.invalid {
  border-color: var(--brand) !important;
  background: rgba(193, 18, 31, 0.06) !important;
  box-shadow: 0 0 0 3px rgba(193, 18, 31, 0.08);
  transition: all 0.15s;
}
.field-error {
  color: var(--brand);
  font-size: 11.5px;
  font-weight: 500;
  margin-top: 4px;
  display: none;
  line-height: 1.4;
}
.field-error.show { display: block; }
.field-error::before { content: "⚠ "; font-weight: 700; }
/* ---- forms ---- */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:12.5px;font-weight:600;color:var(--text-2)}
.field input,.field select,.field textarea{background:var(--input-bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);width:100%;font-size:13.5px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-tint)}
html[data-theme="dark"] .field input:focus,html[data-theme="dark"] .field select:focus{box-shadow:0 0 0 3px rgba(193,18,31,.16)}
.field .hint{font-size:11.5px;color:var(--muted)}
.info-banner{background:var(--info-bg);border:1px solid transparent;border-radius:12px;padding:12px 16px;font-size:13px;color:var(--text-2);margin-bottom:18px;display:flex;gap:10px;align-items:flex-start}
.info-banner svg{width:18px;height:18px;color:var(--info);flex:0 0 18px;margin-top:1px}
.info-banner b{color:var(--text)}
/* ---- product toolbar ---- */
.prod-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.prod-toolbar .grow{flex:1;min-width:180px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.seg button{padding:9px 13px;font-size:12.5px;font-weight:600;color:var(--text-2);background:var(--surface);border-right:1px solid var(--border)}
.seg button:last-child{border-right:none}
.seg button:hover{background:var(--surface-2);color:var(--text)}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
.mini-btn{padding:6px 11px;font-size:12px;font-weight:600;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text)}
.mini-btn:hover{background:var(--surface-2)}
.mini-btn.danger{color:var(--danger);border-color:transparent;background:var(--danger-bg)}
/* ---- modal ---- */
.modal-back{position:fixed;inset:0;background:rgba(6,8,12,.55);z-index:90;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;backdrop-filter:blur(2px);animation:fadeUp .2s}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;overflow:hidden}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{font-family:var(--font-display);font-size:16px;font-weight:700}
.modal-head .x{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.modal-head .x:hover{background:var(--surface-2);color:var(--text)}
.modal-body{padding:20px}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 20px;border-top:1px solid var(--border);background:var(--surface-2)}
.workflow-modal{width:min(850px,90vw);max-width:none;max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
.workflow-modal .modal-body{overflow-y:auto;min-height:0;padding:22px 24px}
.workflow-modal .modal-foot{flex-shrink:0;gap:12px;align-items:center}
.workflow-modal details{padding:10px 0;border-top:1px solid var(--border)}
.workflow-modal details summary{padding:4px 0}
.workflow-zone{border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:14px 16px;margin-bottom:12px}
.workflow-summary{background:linear-gradient(135deg,var(--surface),var(--surface-2));}
.workflow-summary-main{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.workflow-summary-ref{font-size:16px;font-weight:700;letter-spacing:.01em}
.workflow-summary-card{font-size:12px;color:var(--muted);margin-top:4px}
.workflow-global-state{border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:14px}
.workflow-global-value{font-size:18px;font-weight:700;line-height:1.3;margin-top:4px}
.workflow-cashback-label{text-align:right}
.workflow-badges{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.workflow-state-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.workflow-state-card{border:1px solid var(--border);border-radius:10px;padding:11px 12px;background:var(--surface)}
.workflow-state-card .k{display:block;margin-bottom:5px}
.workflow-state-card .v{font-weight:700}
.workflow-next{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--surface-2)}
.workflow-next-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:4px}
.workflow-next-value{font-weight:700}
.workflow-section-title{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:9px}
.workflow-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-right:auto}
@media(max-width:560px){.workflow-state-grid{grid-template-columns:1fr}.workflow-next{align-items:flex-start;flex-direction:column}.workflow-badges{justify-content:flex-start}}
.workflow-summary{display:flex;flex-direction:column;gap:14px;margin-bottom:16px}
.workflow-identity{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;padding:16px 18px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2)}
.workflow-identity .v{margin-top:4px}
.workflow-badges{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.workflow-states{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.workflow-state-card{padding:14px 16px;border:1px solid var(--border);border-radius:12px;background:var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.04)}
.workflow-state-card .k{display:block;margin-bottom:7px}
.workflow-cashback{padding:13px 16px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2)}
.workflow-cashback-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin-top:9px}
.workflow-next{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 16px;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--border));border-radius:12px;background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.workflow-next strong{display:block;margin-top:4px}
@media(max-width:560px){.workflow-states{grid-template-columns:1fr}.workflow-identity{padding:13px}.workflow-modal .modal-body{padding:16px}}
@media(max-width:640px){.form-grid{grid-template-columns:1fr}}
@media(max-width:1200px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}.grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.grid-3{grid-template-columns:1fr}}
@media(max-width:1024px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;top:0;left:0;width:290px;transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1)}
  body.nav-open .sidebar{transform:translateX(0)}
  body.nav-open .overlay{display:block}
  .hamburger{display:flex}
}
@media(max-width:720px){.content{padding:18px 16px 34px}.tb-search{display:none}.tb-date{display:none}.lang-sel{display:none}.page-head h1{font-size:22px}}
@media(max-width:560px){.kpi-grid{grid-template-columns:1fr}.tb-role{display:none}}
</style>

function buildNav(role){
  const allowed=Object.prototype.hasOwnProperty.call(MENU_ROLE_ITEMS,role)
    ? MENU_ROLE_ITEMS[role]
    : MENU_ROLE_ITEMS.DEFAULT;
  const groups=Object.entries(MENU_GROUPS).map(([key,g])=>({key,...g,items:g.items.filter(id=>!allowed||allowed.has(id))})).filter(g=>g.items.length);
  const savedGroup=localStorage.getItem("t2c_nav_group")||"";
  const mobile=window.matchMedia&&window.matchMedia("(max-width: 760px)").matches;
  document.getElementById("nav").innerHTML=groups.map(g=>{

    return `<div class="nav-group ${open?"":"is-closed"}" data-group data-group-key="${g.key}">

function toggleNavGroup(key){
  const node=document.querySelector(`[data-group-key="${key}"]`);if(!node)return;
  const willOpen=node.classList.contains("is-closed");
  document.querySelectorAll("[data-group-key]").forEach(g=>g.classList.add("is-closed"));
  if(willOpen){node.classList.remove("is-closed");localStorage.setItem("t2c_nav_group",key);}else{localStorage.setItem("t2c_nav_group","");}
}

/* ============ API + FORMAT ============ */
async function api(path,opts={}){
  const res=await fetch(API+path,Object.assign({credentials:"same-origin",headers:{"Content-Type":"application/json"}},opts));
  if(res.status===401){location.href="/login.html";throw new Error("unauth");}
  const txt=await res.text();
  if(!res.ok){const err=new Error(txt||String(res.status));err.status=res.status;throw err;}
  try{return txt?JSON.parse(txt):null;}catch(_){return txt;}
}
const nf=new Intl.NumberFormat("fr-FR");
function moneyWithCurrency(v,currency){if(v==null||v=="")return "Non renseigné";const c=String(currency||"FCFA").toUpperCase();return c==="FCFA"?money(v):nf.format(Math.round(Number(v)))+" "+c;}
function money(v){if(v==null||v==="")return "—";return nf.format(Math.round(Number(v)))+" FCFA";}
function num(v){return v==null?"0":nf.format(Number(v));}
function dt(v){if(!v)return "—";const d=new Date(v);if(isNaN(d))return v;return d.toLocaleDateString(LANG==="fr"?"fr-FR":"en-US",{day:"2-digit",month:"short",year:"numeric"});}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function badge(status){
  const s=String(status||"").toUpperCase();
  const map={ACTIVE:"b-ok",VALIDATED:"b-ok",SUCCESS:"b-ok",PAID:"b-ok",APPROVED:"b-ok",OCR_PROCESSED:"b-ok",RESOLVED:"b-ok",
    PENDING:"b-warn",PAID:"b-ok",OCR_PENDING:"b-warn",PAUSED:"b-warn",UNDER_REVIEW:"b-warn",SUBMITTED:"b-info",
    DRAFT:"b-muted",EXPIRED:"b-muted",CLOSED:"b-muted",OPEN:"b-danger",REJECTED:"b-danger",FAILED:"b-danger",SUSPENDED:"b-danger",
    ADMIN:"b-info",PARTNER:"b-ok",OPERATEUR:"b-warn",LECTEUR:"b-muted"};
  return `<span class="badge ${map[s]||"b-muted"}">${esc(stLabel(status))}</span>`;
}

function maskSensitiveSetting(key,value){
  const name=String(key||"").toLowerCase().replace(/[\s-]/g,"_");
  const sensitive=/(password|passwd|pwd|secret|token|api[_]?key|apikey|key|credential|smtp[_]?password|bearer|private)/i.test(name);
  return sensitive ? "……………………" : (value==null||value===""?"—":String(value));
}
function isSensitiveSetting(key){return maskSensitiveSetting(key,"__SENTINEL__")==="……………………";}
function safeSettingValue(key,value){return maskSensitiveSetting(key,value);}
function maskSecret(value){
  const s=String(value||"");
  if(!s) return "…………";
  return s.length>8 ? `${s.slice(0,4)}…………${s.slice(-4)}` : "…………";
}

// Consolidated loyalty-benefits history view (overrides the legacy renderer above).
let LOY_HISTORY_ROWS=[];
function loyaltyBenefitLabel(value){
  const key=String(value||"").toUpperCase();
  return ({CASHBACK_PERCENT:"Bonus cashback fidélité",CASHBACK_FIXED:"Bonus cashback fidélité",LOYALTY_POINTS:"Points fidélité",VOUCHER:"Avantage campagne",TIER_BONUS:"Bonus de niveau",TIER_CHANGE:"Changement de niveau",MANUAL_ADJUSTMENT:"Ajustement manuel",EXCEPTIONAL_BONUS:"Bonus exceptionnel"})[key]||value||"Non renseigné";
}
function loyaltyHistoryValue(value,fallback="Non disponible"){return value===null||value===undefined||String(value).trim()===""?fallback:String(value);}
function loyaltyHistoryAmount(row){return row.cashbackAmount!==null&&row.cashbackAmount!==undefined?moneyWithCurrency(row.cashbackAmount,row.currency||"FCFA"):"0 FCFA";}
function loyaltyHistoryMatches(row){
  const q=(document.getElementById("loyHistorySearch")?.value||"").trim().toLowerCase(),tier=(document.getElementById("loyHistoryTier")?.value||"").toLowerCase(),type=(document.getElementById("loyHistoryType")?.value||"").toLowerCase(),status=(document.getElementById("loyHistoryStatus")?.value||"").toLowerCase(),from=document.getElementById("loyHistoryFrom")?.value||"",to=document.getElementById("loyHistoryTo")?.value||"";
  const text=[row.customerRef,row.accountNumber,row.sourceRef,row.campaignName,row.campaignId,row.paymentRef,row.benefitType,row.voucherCode].filter(Boolean).join(" ").toLowerCase(),day=String(row.calculatedAt||row.createdAt||row.date||"").slice(0,10);
  return (!q||text.includes(q))&&(!tier||String(row.loyaltyTierName||row.tier||"").toLowerCase()===tier)&&(!type||String(row.benefitType||"").toLowerCase()===type)&&(!status||String(row.status||"").toLowerCase()===status)&&(!from||day>=from)&&(!to||day<=to);
}
function loyRenderHistoryRows(){
  const body=document.getElementById("loyHistoryBody"),summary=document.getElementById("loyHistorySummary");if(!body)return;
  const rows=LOY_HISTORY_ROWS.filter(loyaltyHistoryMatches),total=rows.reduce((n,r)=>n+Number(r.cashbackAmount||0),0),bonus=rows.filter(r=>String(r.benefitType||"").toUpperCase().startsWith("CASHBACK")).length,clients=new Set(rows.map(r=>r.customerRef).filter(Boolean)).size;
  if(summary)summary.innerHTML=`<span>Avantages affichés : <b>${rows.length}</b></span><span>Montant total bonus : <b>${money(total)}</b></span><span>Bonus cashback fidélité : <b>${bonus}</b></span><span>Clients concernés : <b>${clients}</b></span>`;

function loyBatchActions(b){

async function loyUploadBatch(){
  const name = document.getElementById("loyUpName").value.trim();
  const fInput = document.getElementById("loyUpFile");
  const file = fInput && fInput.files[0];
  if (!file){ toast("Sélectionnez un fichier", "err"); return; }
  const fd = new FormData();
  fd.append("file", file);
  fd.append("name", name || file.name);
  try{
    toast("Import en cours…");
    const res = await fetch("/api/loyalty/batches/upload", { method:"POST", credentials:"same-origin", body:fd });
    if (!res.ok) throw new Error(await res.text() || res.status);
    const b = await res.json();
    toast(`Batch importé — ${b.parsedRows} lignes`, "ok");
    await loyRefreshAll(); loyRenderKpis(); loyRenderBatches();
  }catch(e){ toast("Erreur import: " + e.message, "err"); }
}

function loyOpenCalcModal(batchId){
  const active = LOY.rules.filter(r => r.active);
  if (active.length === 0){ toast("Aucune règle active. Créez-en une d'abord.", "err"); return; }
  openModal("Appliquer une règle",
    `<div style="margin-bottom:14px"><label style="font-size:12px;color:var(--text-2);font-weight:600;display:block;margin-bottom:6px">Règle de cashback</label>

async function loyRunCalc(batchId){
  const current=LOY.batches.find(x=>Number(x.id)===Number(batchId));
  if(current&&String(current.status).toUpperCase()==="CALCULATED"){toast("Batch déjà calculé", "info");closeModal();return;}
  const ruleId = document.getElementById("loyCalcRuleId").value;
  try{
    toast("Calcul en cours…");
    const b = await api(`/api/loyalty/batches/${batchId}/calculate?ruleId=${ruleId}`, { method:"POST" });
    toast(`Calculé: ${money(b.totalCashback)} sur ${b.clientCount} clients`, "ok");
    closeModal();
    await loyRefreshAll(); loyRenderKpis(); loyRenderBatches();
  }catch(e){ toast("Erreur calcul: " + e.message, "err"); }
}

async function loyOpenBatchDetails(id){
  try{
    const [b, results, clients] = await Promise.all([
      api(`/api/loyalty/batches/${id}`),
      api(`/api/loyalty/batches/${id}/results`),
      api("/api/loyalty/clients").catch(()=>[])
    ]);
    const clientRows = loyListPayload(clients);
    const clientByAccount = new Map(clientRows.map(c => [String(c.accountNumber||c.customerRef||""), c]));
    const reportVolume = r => {
      const direct = r && (r.totalVolume ?? r.volume ?? r.clientVolume ?? r.cumulativeVolume);
      if (direct != null && Number(direct) !== 0) return direct;
      const client = clientByAccount.get(String(r && r.accountNumber || ""));
      return client && (client.lifetimeVolume ?? client.totalVolume) != null
        ? (client.lifetimeVolume ?? client.totalVolume) : (direct ?? 0);
    };
    const reportStatus = r => Number(r && r.cashbackAmount||0) > 0
      ? "APPROVED" : (r && r.note ? "REJECTED" : (r && r.status || "PENDING"));
    const reportStatusLabel = r => {
      if (Number(r && r.cashbackAmount||0) > 0) return "Cashback accordé";
      const raw = String(r && r.status || "PENDING").toUpperCase();
      if (["FAILED","ERROR"].includes(raw)) return "Erreur";
      if (["REJECTED","CANCELLED"].includes(raw) && /rejet|reject|annul/i.test(String(r && r.note || ""))) return "Rejeté";
      return "Non éligible";
    };
    const reportStatusBadge = r => {
      const label = reportStatusLabel(r);
      const cls = label === "Cashback accordé" ? "b-ok" : (label === "Erreur" || label === "Rejeté" ? "b-danger" : "b-warn");

    };
    const reportReason = r => r && r.note ? r.note : (Number(r && r.cashbackAmount||0) > 0 ? "Cashback généré" : "Conditions de la règle non remplies");
    const top = (results||[]).slice(0, 100);
    const earned = (results||[]).filter(r => Number(r.cashbackAmount||0) > 0).length;
    const batchSummary = earned === 0
      ? `Aucun client éligible à la règle ${esc(b.ruleNameSnapshot||"sélectionnée")} sur ce batch.`
      : `Règle appliquée : ${esc(b.ruleNameSnapshot||"sélectionnée")} — ${earned} client${earned>1?"s":""} sur ${(results||[]).length} a obtenu un cashback fidélité, total ${money(b.totalCashback)}.`;
    const rowsHtml = top.length === 0
      ? `<tr><td colspan="6">${emptyMini("Pas encore de résultats — calculez le batch.")}</td></tr>`
      : top.map(r => `<tr>
          <td><strong>${esc(r.clientName||"—")}</strong><br><span class="mono" style="color:var(--muted);font-size:11px">${esc(r.accountNumber)}</span></td>

          <td style="text-align:right" class="mono"><strong>${money(r.cashbackAmount)}</strong></td>
          <td>${reportStatusBadge(r)}</td>
          <td style="font-size:11px;color:var(--muted)">${esc(reportReason(r))}</td></tr>`).join("");
    openModal(`Batch ${b.id} — ${esc(b.name||"")}`,
      `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;font-size:13px;margin-bottom:16px">
        <div><span style="color:var(--muted)">Statut</span><br>${loyStatusBadge(b.status)}</div>
        <div><span style="color:var(--muted)">Fichier</span><br><span class="mono" style="font-size:11px">${esc(b.sourceFilename||"—")}</span></div>
        <div><span style="color:var(--muted)">Règle</span><br>${esc(b.ruleNameSnapshot||"—")}</div>
        <div><span style="color:var(--muted)">Lignes</span><br>${num(b.parsedRows)} / ${num(b.totalRows)}</div>
        <div><span style="color:var(--muted)">Volume</span><br><strong>${money(loyBatchVolume(b))}</strong></div>
        <div><span style="color:var(--muted)">Cashback</span><br><strong style="color:var(--brand)">${money(b.totalCashback)}</strong></div>
      </div>
      <div style="padding:10px 14px;background:var(--surface-2);border-radius:8px;font-size:12px;color:var(--text-2);margin-bottom:14px">${batchSummary}<br><span style="color:var(--muted)">Volume fidélité = activité importée ; cashback = avantage calculé par la règle.</span></div>
      <h4 style="font-size:13px;margin-bottom:10px">Top résultats (${(results||[]).length})</h4>
      <div style="max-height:320px;overflow:auto;border:1px solid var(--border);border-radius:8px">
        <table style="width:100%;min-width:760px;table-layout:fixed;font-size:12px"><thead style="background:var(--surface-2);position:sticky;top:0">
          <tr><th style="width:260px;padding:8px 12px;text-align:left;font-size:11px;text-transform:uppercase;color:var(--muted);white-space:nowrap">Client</th>

              <th style="width:145px;padding:8px 12px;text-align:right;font-size:11px;text-transform:uppercase;color:var(--muted);white-space:nowrap">Volume fidélité</th>
              <th style="width:145px;padding:8px 12px;text-align:right;font-size:11px;text-transform:uppercase;color:var(--muted);white-space:nowrap">Cashback gagné</th>

function loyDecorateRuleModal(){const modal=document.getElementById("modalBack");if(!modal)return;const labels=modal.querySelectorAll("label"),map={"Nom":"Nom de la règle","Pourcentage (%)":"Bonus cashback (%)","Min. par transaction":"Montant minimum par transaction","Min. volume période":"Volume minimum sur la période","Cap cashback / client":"Plafond cashback par client","Filtre tiers clients":"Niveaux concernés","Valeur moyenne min. par tx (FCFA)":"Valeur moyenne minimum par transaction","Ancienneté min. (mois)":"Ancienneté minimum du client"};labels.forEach(l=>{const key=l.textContent.trim();if(map[key])l.textContent=map[key];});modal.querySelectorAll("input").forEach(i=>{if(i.placeholder==="Ex: Cashback GOLD 1%")i.placeholder="Ex: Bonus Premium +0,5 %";if(i.placeholder==="Ex: GOLD,PLATINUM")i.placeholder="Ex: Premium, Prestige";});const advanced=[...labels].find(l=>l.textContent.includes("Critères bancaires avancés"));if(advanced&&!advanced.parentElement.querySelector(".rule-help")){const help=document.createElement("div");help.className="rule-help";help.style.cssText="font-size:12px;color:var(--muted);margin:-4px 0 12px";help.textContent="Ces critères permettent de cibler les clients éligibles à la règle selon leur profil et leur activité.";advanced.parentElement.insertAdjacentElement("afterend",help);}}

    ? '<div class="empty-state">Impossible de charger les règles. Vérifiez votre session puis réessayez.</div>'
    : (rows.length === 0 ? emptyMini("Aucune règle. Créez-en une pour appliquer un cashback.") : null);
  c.innerHTML = `<div class="panel"><div class="panel-head"><h3>Règles de cashback</h3>
    <button class="btn btn-primary" onclick="loyOpenRuleModal()">+ Nouvelle règle</button></div>
    <div class="panel-body" style="padding:0">
      <div class="table-wrap"><div class="table-scroll"><table>
        <thead><tr><th>Nom</th><th>Type</th><th>Taux / Paliers</th>
          <th style="text-align:right">Min tx</th><th style="text-align:right">Min période</th>
          <th style="text-align:right">Cap client</th><th>Filtre</th><th>Statut</th><th style="width:150px">Actions</th></tr></thead>
        <tbody>${rulesMessage
          ? `<tr><td colspan="9">${rulesMessage}</td></tr>`
          : rows.map(r => `<tr>
              <td><strong>${esc(r.name)}</strong><br><span style="font-size:11px;color:var(--muted)">${esc(r.description||"")}</span></td>
              <td><span class="badge b-info">${esc(r.type)}</span></td>
              <td>${r.type === "TIERED_VOLUME" ? loyRenderTiers(r.tiersJson) : (r.percentage ? esc(r.percentage) + " %" : "—")}</td>
              <td style="text-align:right" class="mono">${money(r.minTransactionAmount)}</td>
              <td style="text-align:right" class="mono">${money(r.minPeriodVolume)}</td>
              <td style="text-align:right" class="mono">${money(r.maxCashbackPerClient)}</td>
              <td style="font-size:11px">${r.categoryFilter ? `Cat: <span class="mono">${esc(r.categoryFilter)}</span><br>` : ""}${r.tierFilter ? `Tier: <span class="mono">${esc(r.tierFilter)}</span>` : ""}${(!r.categoryFilter && !r.tierFilter) ? "—" : ""}</td>
              <td>${loyStatusBadge(r.active ? "ACTIVE" : "INACTIVE")}</td>
              <td>
                <button class="mini-btn" onclick="loyOpenRuleModal(${r.id})">Modifier</button>
                <button class="mini-btn danger" onclick="loyDeleteRule(${r.id})">Désactiver</button>
              </td></tr>`).join("")}
        </tbody></table></div></div>
    </div></div>`;
}

function loyRenderTiers(json){
  if (!json) return "—";
  try{ const arr = JSON.parse(json); return arr.map(t => `${money(t.minVolume)} →' ${t.percentage}%`).join("<br>"); }
  catch(_){ return "<em style='color:var(--danger)'>Format invalide</em>"; }
}

    <label style="font-size:12px;color:var(--text-2);font-weight:600;display:block;margin-bottom:6px">${label}</label>
    <input id="${id_}" type="${type||"text"}" value="${esc(value==null?"":value)}" placeholder="${esc(placeholder||"")}"
      style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--input-bg);color:var(--text);font-size:14px"></div>`;
  openModal(id ? "Modifier la règle" : "Nouvelle règle de cashback",
    `${inp("loyRName","Nom", r.name, "Ex: Cashback GOLD 1%")}
     ${inp("loyRDesc","Description", r.description, "")}
     <div class="grid-2">
      <div><label style="font-size:12px;color:var(--text-2);font-weight:600;display:block;margin-bottom:6px">Type</label>
        <select id="loyRType" onchange="loyToggleRuleFields()" style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--input-bg);color:var(--text);font-size:14px">
          <option value="FLAT_PERCENTAGE" ${r.type==="FLAT_PERCENTAGE"?"selected":""}>Pourcentage fixe</option>
          <option value="TIERED_VOLUME" ${r.type==="TIERED_VOLUME"?"selected":""}>Paliers par volume</option>
          <option value="CATEGORY_BASED" ${r.type==="CATEGORY_BASED"?"selected":""}>Par catégorie</option>
        </select></div>
      <div><label style="font-size:12px;color:var(--text-2);font-weight:600;display:block;margin-bottom:6px">Statut</label>
        <select id="loyRActive" style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--input-bg);color:var(--text);font-size:14px">
          <option value="true" ${r.active!==false?"selected":""}>Actif</option>
          <option value="false" ${r.active===false?"selected":""}>Inactif</option>
        </select></div>
     </div>
     <div id="loyFPct" style="margin-top:12px">${inp("loyRPct","Pourcentage (%)", r.percentage, "Ex: 1.5", "number")}</div>
     <div id="loyFTiers" style="display:none;margin-top:12px">
       <label style="font-size:12px;color:var(--text-2);font-weight:600;display:block;margin-bottom:6px">Paliers (JSON)</label>
       <textarea id="loyRTiers" rows="4" style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--input-bg);color:var(--text);font-family:monospace;font-size:12px">${esc(r.tiersJson||'[{"minVolume":0,"percentage":1.0},{"minVolume":1000000,"percentage":1.5},{"minVolume":10000000,"percentage":2.5}]')}</textarea>
       <div style="font-size:11px;color:var(--muted);margin-top:4px">Trier par minVolume croissant.</div>
     </div>
     <div id="loyFCat" style="display:none;margin-top:12px">${inp("loyRCat","Catégorie", r.categoryFilter, "Ex: CARD_PURCHASE")}</div>
     <div class="grid-2" style="margin-top:12px">
       ${inp("loyRMinTx","Min. par transaction", r.minTransactionAmount, "", "number")}
       ${inp("loyRMinPer","Min. volume période", r.minPeriodVolume, "Ex: 500000", "number")}
     </div>
     <div class="grid-2">
       ${inp("loyRMax","Cap cashback / client", r.maxCashbackPerClient, "Ex: 100000", "number")}
       ${inp("loyRTierFilter","Filtre tiers clients", r.tierFilter, "Ex: GOLD,PLATINUM")}
     </div>
     <div style="margin:14px 0 8px;padding-top:14px;border-top:1px solid var(--border);font-size:12px;color:var(--text-2);font-weight:600;text-transform:uppercase;letter-spacing:.5px">Critères bancaires avancés</div>
     <div class="grid-2">
       <div style="margin-bottom:12px">
         <label style="font-size:12px;color:var(--text-2);font-weight:600;display:block;margin-bottom:6px">Segment</label>
         <select id="loyREntity" style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--input-bg);color:var(--text);font-size:14px">
           <option value="" ${!r.entityTypeFilter?"selected":""}>Tous (particuliers + entreprises)</option>

}

function loyToggleRuleFields(){
  const t = document.getElementById("loyRType").value;
  document.getElementById("loyFPct").style.display   = (t === "TIERED_VOLUME") ? "none" : "";
  document.getElementById("loyFTiers").style.display = (t === "TIERED_VOLUME") ? "" : "none";
  document.getElementById("loyFCat").style.display   = (t === "CATEGORY_BASED") ? "" : "none";
}

async function loySaveRule(id){
  const body = {
    name: val("loyRName"),
    description: val("loyRDesc"),
    type: document.getElementById("loyRType").value,
    active: document.getElementById("loyRActive").value === "true"
  };
  const pct = val("loyRPct"); if (pct) body.percentage = parseFloat(pct);
  const tiers = val("loyRTiers"); if (tiers) body.tiersJson = tiers;
  const cat = val("loyRCat"); if (cat) body.categoryFilter = cat;
  const minTx = val("loyRMinTx"); if (minTx) body.minTransactionAmount = parseFloat(minTx);
  const minPer = val("loyRMinPer"); if (minPer) body.minPeriodVolume = parseFloat(minPer);
  const max = val("loyRMax"); if (max) body.maxCashbackPerClient = parseFloat(max);
  const tf = val("loyRTierFilter"); if (tf) body.tierFilter = tf;
  const entSel = document.getElementById("loyREntity"); if (entSel && entSel.value) body.entityTypeFilter = entSel.value;
  const mtc = val("loyRMinTxCount"); if (mtc) body.minTransactionCount = parseInt(mtc);
  const mav = val("loyRMinAvg"); if (mav) body.minAvgTransactionValue = parseFloat(mav);
  const mtn = val("loyRMinTenure"); if (mtn) body.minAccountAgeMonths = parseInt(mtn);
  if (!body.name){ toast("Nom requis", "err"); return; }
  try{
    const method = id ? "PUT" : "POST";
    const url = id ? `/api/loyalty/rules/${id}` : "/api/loyalty/rules";
    await api(url, { method, body: JSON.stringify(body) });
    toast("Règle enregistrée", "ok");
    closeModal();
    await loyRefreshAll(); loyRenderKpis(); loyRenderRules();
  }catch(e){ toast("Erreur: " + e.message, "err"); }
}

async function loyDeleteRule(id){
  if (!confirm("Désactiver cette règle ?")) return;
  try{
    await api(`/api/loyalty/rules/${id}`, { method:"DELETE" });
    toast("Règle désactivée", "ok");
    await loyRefreshAll(); loyRenderRules();
  }catch(e){ toast("Erreur: " + e.message, "err"); }
}

  const tb = document.getElementById("loyClientRows"); if(!tb) return;

  tb.innerHTML = rows.map(c => `<tr>
    <td><strong>${esc(c.fullName||"—")}</strong></td>
    <td><span class="mono">${esc(c.accountNumber)}</span></td>
    <td>${loyTypeBadge(c.entityType)}</td>
    <td><span class="badge b-info">${esc(c.tier||"CLASSIC")}</span></td>
    <td>${esc(c.city||"—")}</td>
    <td>${esc(c.phone||"—")}</td>
    <td style="text-align:right" class="mono">${money(c.lifetimeVolume)}</td>
    <td style="text-align:right" class="mono"><strong>${money(c.lifetimeCashback)}</strong></td>
    <td><button class="mini-btn" onclick="loyOpenClientModal(${c.id})">Modifier</button></td>
  </tr>`).join("");
}

function loyaltyClientName(c){return c.name||c.clientName||c.customerName||c.nom||c.fullName||"Client non renseigné";}
function loyaltyMaskedCard(c){const raw=c.maskedCard||c.maskedAccount||c.accountMasked||c.compteMasque;return raw?String(raw):"Non disponible";}
function loyaltyBonusPercent(c){const tier=String(c.tier||c.loyaltyTierName||"").toUpperCase(),value=c.cashbackBonusPercent??c.loyaltyBonusPercent??c.bonusPercent??c.tier?.cashbackBonusPercent;const fallback={ESSENTIEL:0,CLASSIC:0,PREMIUM:.5,PRESTIGE:1,ELITE:2};return value==null?(fallback[tier]??0):Number(value);}
function loyDrawClientRows(rows){const tb=document.getElementById("loyClientRows");if(!tb)return;if(!rows.length){tb.innerHTML=`<tr><td colspan="8">${emptyMini("Aucun client enrôlé")}</td></tr>`;return;}tb.innerHTML=rows.map(c=>`<tr><td><strong>${esc(loyaltyClientName(c))}</strong></td><td class="mono">${esc(c.accountNumber||c.customerRef||"Non renseigné")}</td><td class="mono">${esc(loyaltyMaskedCard(c))}</td><td><span class="badge b-info">${esc(c.tier||c.loyaltyTierName||"Non renseigné")}</span></td><td class="mono">${esc(money(c.lifetimeVolume))}</td><td class="mono">+${String(loyaltyBonusPercent(c)).replace(".",",")} %</td><td><span class="badge ${c.active===false?"b-muted":"b-ok"}">${c.active===false?"Inactif":"Actif"}</span></td><td><button class="mini-btn" onclick="loyOpenClientProfile(${Number(c.id)||0})">Voir fiche</button></td></tr>`).join("");}
function loyFilterClients(){const q=String(document.getElementById("loyClientSearch")?.value||"").toLowerCase(),tier=String(document.getElementById("loyTierFilter")?.value||"").toLowerCase(),status=document.getElementById("loyStatusFilter")?.value||"",min=String(document.getElementById("loyVolumeMin")?.value||"")===""?null:Number(document.getElementById("loyVolumeMin")?.value),max=String(document.getElementById("loyVolumeMax")?.value||"")===""?null:Number(document.getElementById("loyVolumeMax")?.value);loyDrawClientRows(LOY.clients.filter(c=>{const hay=[c.fullName,c.accountNumber,c.phone,c.city,c.maskedCard,c.cardNumber].filter(Boolean).join(" ").toLowerCase(),volume=Number(c.lifetimeVolume||0),active=c.active!==false;return(!q||hay.includes(q))&&(!tier||String(c.tier||"").toLowerCase()===tier)&&(!status||(status==="active"?active:!active))&&(min===null||volume>=min)&&(max===null||volume<=max);}));}
function loyOpenClientProfile(id){const c=(LOY.clients||[]).find(x=>Number(x.id)===Number(id));if(!c)return;openModal("Fiche client fidélité",`<div class="panel-body"><div class="workflow-section-title">Synthèse client</div><div class="pf-row"><span class="k">Client</span><span class="v">${esc(loyaltyClientName(c))}</span></div><div class="pf-row"><span class="k">Référence client</span><span class="v mono">${esc(c.accountNumber||c.customerRef||"Non renseigné")}</span></div><div class="pf-row"><span class="k">Carte / compte masqué</span><span class="v mono">${esc(loyaltyMaskedCard(c))}</span></div><div class="pf-row"><span class="k">Statut</span><span class="v">${c.active===false?"Inactif":"Actif"}</span></div><div class="workflow-section-title" style="margin-top:16px">Niveau fidélité</div><div class="pf-row"><span class="k">Niveau actuel</span><span class="v">${esc(c.tier||c.loyaltyTierName||"Non disponible")}</span></div><div class="pf-row"><span class="k">Volume cumulé</span><span class="v">${esc(money(c.lifetimeVolume))}</span></div><div class="pf-row"><span class="k">Transactions</span><span class="v">${esc(String(c.transactionCount??"Non renseigné"))}</span></div><div class="pf-row"><span class="k">Bonus cashback applicable</span><span class="v">+${String(loyaltyBonusPercent(c)).replace(".",",")} %</span></div><div style="margin-top:16px;padding:10px 12px;background:var(--surface-2);border-radius:8px;font-size:12px;color:var(--muted)">Le bonus fidélité est appliqué au cashback uniquement lorsque la campagne cashback l’autorise.</div><div class="workflow-section-title" style="margin-top:16px">Historique fidélité</div><div style="font-size:12px;color:var(--muted)">${c.rewardHistory&&c.rewardHistory.length?"Historique disponible dans les avantages clients.":"Aucun historique fidélité disponible."}</div></div>`,`<button class="btn btn-ghost" onclick="closeModal()">Fermer</button>`);}

async function loySaveClient(id){
  const body = {
    accountNumber: val("loyCAcc"),
    fullName: val("loyCName"),
    phone: val("loyCPhone"),
    email: val("loyCEmail"),
    cardNumber: val("loyCCard"),
    tier: document.getElementById("loyCTier").value,
    entityType: document.getElementById("loyCType").value,
    city: val("loyCCity"),
    branch: val("loyCBranch"),
    accountOpenedDate: val("loyCOpened") || null
  };
  const since = val("loyCSince"); if (since) body.clientSinceDate = since;

function donut(data){
  const total=data.reduce((a,b)=>a+b.v,0)||1;let acc=0;const R=52,C=2*Math.PI*R;
  const segs=data.map(d=>{const frac=d.v/total,dash=frac*C,seg=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${d.c}" stroke-width="18" stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-acc*C}" transform="rotate(-90 70 70)"/>`;acc+=frac;return seg;}).join("");
  return `<div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap"><svg width="140" height="140" viewBox="0 0 140 140" style="flex:0 0 140px">
    <circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--border)" stroke-width="18"/>${segs}
    <text x="70" y="66" text-anchor="middle" font-size="26" font-weight="800" fill="var(--text)" font-family="Plus Jakarta Sans">${total}</text>
    <text x="70" y="84" text-anchor="middle" font-size="10" fill="var(--muted)">${t("claims_lc")}</text></svg>
    <div class="legend" style="flex:1;min-width:160px">${data.map(d=>`<div class="row"><span class="sw" style="background:${d.c}"></span>${d.k}<b>${d.v}</b></div>`).join("")}</div></div>`;
}

/* ============ CLAIMS CLIENTS ============
   Vue métier dédiée : les réclamations restent distinctes du contrôle
   manuel des transactions. Aucun cardHash n'est rendu dans cette vue. */
function claimStatusLabel(status){
  const s=String(status||"").toUpperCase();
  return ({SUBMITTED:"Soumise",APPROVED:"Approuvée",REJECTED:"Rejetée",PAID:"Paiement traité",PAYMENT_FAILED:"Échec de paiement",IN_REVIEW:"En analyse",REVIEWING:"En analyse"}[s]||"En attente");
}
function claimStatusClass(status){
  const s=String(status||"").toUpperCase();
  return s==="APPROVED"||s==="PAID"?"b-ok":s==="REJECTED"||s==="PAYMENT_FAILED"?"b-danger":s==="IN_REVIEW"||s==="REVIEWING"?"b-warn":"b-info";
}
function claimValue(row){
  return row&&row!==""&&row!==null&&row!==undefined?row:"Non renseigné";
}
function claimClientLabel(row){
  return row.customerRef||row.clientRef||row.userId||row.beneficiary||row.customerName||"Client non identifié";
}
function claimReasonLabel(row){
  return row.reason||row.motif||row.claimReason||row.description||row.reviewNotes||"Motif non renseigné";
}
function claimMoney(row){
  const value=row.cashbackAmount??row.amount;
  return value===null||value===undefined||value===""?"Non renseigné":moneyWithCurrency(value,row.currency||"FCFA");
}
function claimDate(row){
  const value=row.processedAt||row.treatedAt||row.submittedAt||row.createdAt;
  return value?dt(value):"Non renseigné";
}
function claimRows(){return Array.isArray(CACHE.claims)?CACHE.claims:[];}
function filterClaimRows(){
  const q=String(document.getElementById("claimSearch")?.value||"").trim().toLowerCase();
  const status=String(document.getElementById("claimStatusFilter")?.value||"").toUpperCase();
  const reason=String(document.getElementById("claimReasonFilter")?.value||"").toLowerCase();
  const priority=String(document.getElementById("claimPriorityFilter")?.value||"").toLowerCase();
  const rows=claimRows().filter(r=>{
    const hay=[r.claimReference,r.customerRef,r.clientRef,r.userId,r.merchantId,r.transactionRef,r.ticketId,r.maskedCard,claimReasonLabel(r)].filter(Boolean).join(" ").toLowerCase();
    const rs=String(r.status||"").toUpperCase();
    return (!q||hay.includes(q))&&(!status||rs===status)&&(!reason||claimReasonLabel(r).toLowerCase().includes(reason))&&(!priority||String(r.priority||"Normale").toLowerCase()===priority);
  });
  paintClaims(rows); return rows;
}

async function usrSave(id){
  const body = {
    username: val("usr_username"),
    fullName: val("usr_fullname"),
    email: val("usr_email"),
    role: val("usr_role")
  };
  const pwd = val("usr_password");
  if (pwd) body.password = pwd;
  const mid = val("usr_merchant");

  if (!body.username || !body.fullName || !body.email || !body.role) {
    toast("Tous les champs marqués * sont requis", "err"); return;
  }
  if (!id && !pwd) { toast("Mot de passe requis pour un nouvel utilisateur", "err"); return; }
  if (body.role === "PARTNER" && !mid) { toast("Marchand requis pour un partenaire", "err"); return; }

  try {
    const res = await api(id ? `/api/auth/users/${id}` : "/api/auth/users",
      { method: id ? "PUT" : "POST", body: JSON.stringify(body) });
    // Assign merchant if partner
    if (body.role === "PARTNER") {
      const uid = id || (res && (res.id || res.userId));
      if (uid && mid) {
        try { await api(`/api/auth/users/${uid}/merchant?merchantId=${mid}`, { method: "PUT" }); }
        catch(_) {}

    let m = String(e.message || e);
    try { const j = JSON.parse(m); if (j.error) m = j.error; } catch(_) {}
    toast(m.slice(0, 200), "err");
  }
}

/* --- Field validation library (V7) --- */
const FIELD_VALIDATORS = {
  name: v => {
    if (!v || !v.trim()) return "Ce champ est requis";
    const t = v.trim();
    if (t.length < 2) return "Au moins 2 caractères";
    if (t.length > 200) return "Maximum 200 caractères";
    if (!/[\p{L}]/u.test(t)) return "Doit contenir au moins une lettre";
    return null;
  },
  sku: v => {
    if (!v) return null;
    if (!/^[A-Za-z0-9._\-]{1,60}$/.test(v.trim())) return "Lettres, chiffres, . _ - (60 max)";
    return null;
  },
  email: v => {
    if (!v) return null;
    if (!/^[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}$/.test(v.trim())) return "Format email invalide";
    return null;
  },
  requiredEmail: v => {
    if (!v || !v.trim()) return "L'email est requis";
    return FIELD_VALIDATORS.email(v);
  },
  phone: v => {
    if (!v) return null;
    if (!/^[+]?[0-9\s.\-]{7,20}$/.test(v.trim())) return "Format téléphone invalide";
    return null;
  },
  username: v => {
    if (!v || !v.trim()) return "Nom d'utilisateur requis";
    const t = v.trim();
    if (/^[A-Za-z0-9._\-]{3,40}$/.test(t)) return null;
    if (/^[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}$/.test(t)) return null;
    return "3-40 caractères (lettres, chiffres, . _ -) ou email";
  },
  password: v => {
    if (!v) return "Mot de passe requis";
    if (v.length < 8) return "Au moins 8 caractères";
    return null;
  },
  percentage: v => {
    if (v === "" || v == null) return null;
    const n = parseFloat(v);
    if (isNaN(n)) return "Nombre invalide";
    if (n < 0) return "Doit être … 0";
    if (n > 100) return "Doit être … 100";
    return null;
  },
  positive: v => {
    if (v === "" || v == null) return null;
    const n = parseFloat(v);
    if (isNaN(n)) return "Nombre invalide";
    if (n <= 0) return "Doit être strictement positif";
    return null;
  },
  positiveOrZero: v => {
    if (v === "" || v == null) return null;
    const n = parseFloat(v);
    if (isNaN(n)) return "Nombre invalide";
    if (n < 0) return "Doit être … 0";
    return null;
  },
  minText: (v, min) => {
    if (!v || !v.trim()) return "Ce champ est requis";
    if (v.trim().length < min) return `Au moins ${min} caractères`;
    return null;
  },
  account: v => {
    if (!v || !v.trim()) return "Numéro de compte requis";
    if (!/^[A-Za-z0-9]{5,30}$/.test(v.trim())) return "5-30 caractères alphanumériques";
    return null;
  }
};

function validateField(input, validatorType) {
  const validator = FIELD_VALIDATORS[validatorType];
  if (!validator) return true;
  const err = validator(input.value);
  const errEl = input.parentElement && input.parentElement.querySelector(".field-error");
  if (err) {
    input.classList.add("invalid");
    if (errEl) { errEl.textContent = err; errEl.classList.add("show"); }
    return false;
  } else {
    input.classList.remove("invalid");
    if (errEl) { errEl.classList.remove("show"); errEl.textContent = ""; }
    return true;
  }
}

/* Helper: attach live validation to all inputs with data-validate inside a container. */
function wireLiveValidation(rootSelector) {
  const root = typeof rootSelector === "string" ? document.querySelector(rootSelector) : rootSelector;
  if (!root) return;
  root.querySelectorAll("[data-validate]").forEach(input => {
    const type = input.getAttribute("data-validate");
    input.addEventListener("input", () => validateField(input, type));
    input.addEventListener("blur", () => validateField(input, type));
  });
}

function barChart(data,unit){
  const max=Math.max(1,...data.map(d=>d.v));
  return `<div style="display:flex;align-items:flex-end;gap:12px;height:180px;padding-top:10px">${data.map(d=>{
    const h=Math.round((d.v/max)*150);
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0">
      <div style="font-size:11px;font-weight:700;color:var(--text-2)">${unit==="money"?money(d.v):num(d.v)}</div>
      <div style="width:100%;max-width:46px;height:${h}px;background:linear-gradient(180deg,var(--brand),#f2545b);border-radius:8px 8px 3px 3px"></div>
      <div style="font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%">${esc(d.k)}</div>
    </div>`;}).join("")}</div>`;
}

        </div>
      </div></div>`;
    return `<div class="field"><label>${t(lbl)}</label><input id="cf_${f}" type="${type==="number"?"number":"text"}" value="${esc(cur==null?"":cur)}"></div>`;
  }).join("")}</div>`;
  openModal(id?t("edit"):t("new_item"),body,`<button class="btn btn-ghost" onclick="closeModal()">${t("cancel")}</button><button class="btn btn-primary" onclick="crudSubmit('${key}',${id||0})">${t("save")}</button>`);

async function crudSubmit(key,id){
  const cfg=CRUD[key],body={};
  cfg.fields.forEach(fd=>{const [f,,type]=fd,el=document.getElementById("cf_"+f);if(!el)return;let v=el.value;
    if(type==="number")v=v===""?null:Number(v);else if(type==="bool")v=(v==="true");else if(type==="merchant")v=v===""?null:Number(v);
    else if(type==="image")v=v===""?null:v;
    body[f]=v;});
  if(!body.name){toast(t("f_name"),"err");return;}
  try{
    if(id)await api(`${cfg.ep}/${id}`,{method:"PUT",body:JSON.stringify(body)});
    else await api(cfg.ep,{method:"POST",body:JSON.stringify(body)});
    toast(t("saved_ok"),"ok");closeModal();renderCrud(key);
  }catch(e){toast(String(e.message||e).slice(0,140),"err");}
}
function crudReadImage(event,fieldId){
  const file=event.target.files&&event.target.files[0];
  if(!file){return;}
  if(file.size>2*1024*1024){toast("Image trop grande (max 2MB)","err");event.target.value="";return;}
  const reader=new FileReader();
  reader.onload=function(){
    const dataUrl=reader.result;
    document.getElementById(fieldId).value=dataUrl;
    const prev=document.getElementById(fieldId+"_preview");
    if(prev) prev.innerHTML=`<img src="${dataUrl}" style="width:100%;height:100%;object-fit:cover">`;
  };
  reader.readAsDataURL(file);
}
function crudClearImage(fieldId){
  document.getElementById(fieldId).value="";
  const prev=document.getElementById(fieldId+"_preview");
  if(prev) prev.innerHTML='<span style="color:var(--muted);font-size:10px;text-align:center;padding:4px">Aucune image</span>';
}
async function crudDelete(key,id){
  if(!confirm(t("confirm_del2")))return;const cfg=CRUD[key];
  try{await api(`${cfg.ep}/${id}`,{method:"DELETE"});toast(t("deleted_ok"),"ok");
    window.__crud[key]=(window.__crud[key]||[]).filter(x=>x.id!==id);paintCrud(key);
  }catch(e){toast(String(e.message||e).slice(0,120),"err");}
}

function genPassword(){
  const U="ABCDEFGHJKLMNPQRSTUVWXYZ",L="abcdefghijkmnpqrstuvwxyz",D="23456789",A=U+L+D;
  let p=[U[Math.floor(Math.random()*U.length)],L[Math.floor(Math.random()*L.length)],D[Math.floor(Math.random()*D.length)]];
  for(let i=0;i<7;i++)p.push(A[Math.floor(Math.random()*A.length)]);
  return p.sort(()=>Math.random()-0.5).join("");
}

function cmpUpdateCashbackHint(){
  const t=document.getElementById("cmp_cbtype")?.value;
  const lbl=document.getElementById("cmp_cbval_label");
  const hint=document.getElementById("cmp_cbval_hint");
  if(!lbl||!hint) return;
  if(t==="PERCENTAGE"){ lbl.textContent="Pourcentage (0-100) *"; hint.textContent="Ex: 2.5 pour 2.5%"; }
  else { lbl.textContent="Montant fixe (FCFA) *"; hint.textContent="Ex: 500 pour 500 FCFA par transaction"; }
}

function cmpUpdatePeriodHint(){
  const s=document.getElementById("cmp_start")?.value;
  const e=document.getElementById("cmp_end")?.value;
  const hint=document.getElementById("cmp_period_hint");
  if(!hint) return;
  if(!s||!e){ hint.textContent=""; return; }
  const d1=new Date(s), d2=new Date(e);
  if(d2<d1){ hint.style.color="var(--danger)"; hint.textContent="⚠️ La date de fin doit être après le début"; return; }
  const days=Math.round((d2-d1)/86400000)+1;
  hint.style.color="var(--muted)";
  hint.textContent=`Durée : ${days} jour${days>1?"s":""}`;
}

function cmpApplyPeriod(preset){
  const s=document.getElementById("cmp_start"), e=document.getElementById("cmp_end");
  const today=new Date(); today.setHours(0,0,0,0);
  const fmt=d=>d.toISOString().substring(0,10);
  let start, end;
  if(preset==="thisMonth"){
    start=new Date(today.getFullYear(),today.getMonth(),1);
    end=new Date(today.getFullYear(),today.getMonth()+1,0);
  } else if(preset==="nextMonth"){
    start=new Date(today.getFullYear(),today.getMonth()+1,1);
    end=new Date(today.getFullYear(),today.getMonth()+2,0);
  } else if(preset==="thisQuarter"){
    const q=Math.floor(today.getMonth()/3);
    start=new Date(today.getFullYear(),q*3,1);
    end=new Date(today.getFullYear(),q*3+3,0);
  } else if(preset==="thisYear"){
    start=new Date(today.getFullYear(),0,1);
    end=new Date(today.getFullYear(),11,31);
  } else if(preset==="next30"){
    start=new Date(today); end=new Date(today); end.setDate(end.getDate()+29);
  } else if(preset==="next90"){
    start=new Date(today); end=new Date(today); end.setDate(end.getDate()+89);
  } else return;
  s.value=fmt(start); e.value=fmt(end);
  cmpUpdatePeriodHint();
}

    minTransactionAmount:val("cmp_minTx")?parseFloat(val("cmp_minTx")):null,
    maxCashbackPerClient:val("cmp_maxCb")?parseFloat(val("cmp_maxCb")):null

    body.volumeThreshold=val("cmp_volumeThreshold")?parseFloat(val("cmp_volumeThreshold")):null;

    body.channelFilter=val("cmp_channelFilter")||null;
    body.corridorFilter=val("cmp_corridorFilter")||null;
    body.cardBinStart=val("cmp_binStart")||null;
    body.cardBinEnd=val("cmp_binEnd")||null;
  }

  if(!body.name){ toast("Nom de la campagne requis","err"); return; }

  try{
    const method=draft.id?"PUT":"POST";
    const url=draft.id?`/api/campaigns/${draft.id}`:"/api/campaigns";
    await api(url,{method,body:JSON.stringify(body)});
    toast(t("saved_ok"),"ok");

    window.__cmpDraft=null;
    renderCampaigns();

    let msg=String(e.message||e);
    try{ const parsed=JSON.parse(msg); if(parsed.error) msg=parsed.error; }catch(_){}
    toast(msg.slice(0,200),"err");

function reviewWorkflowLabel(row){return workflowOperationalLabel(row.currentStep||row.workflowStatus);}
function reviewRiskLabel(row){const n=Number(row.fraudScore);if(!Number.isFinite(n))return ["Non évalué","b-muted"];return n>=80?["Élevé","b-danger"]:(n>=50?["Moyen","b-warn"]:["Faible","b-ok"]);}
function reviewFilterRows(){
  const q=String(document.getElementById("rqSearch")?.value||"").toLowerCase().trim();
  const status=String(document.getElementById("rqStatusFilter")?.value||"");
  const risk=String(document.getElementById("rqRiskFilter")?.value||"");
  const manual=String(document.getElementById("rqManualFilter")?.value||"");
  const merchant=String(document.getElementById("rqMerchantFilter")?.value||"").toLowerCase().trim();
  const rows=(CACHE.reviewQueue||[]).filter(row=>{
    const text=[row.transactionRef,row.maskedCard,row.merchantName,row.campaignName,row.campaignId,row.lastWorkflowComment,row.rejectionReason].filter(Boolean).join(" ").toLowerCase();
    const label=reviewWorkflowLabel(row);
    const riskLabel=reviewRiskLabel(row)[0];
    return (!q||text.includes(q))&&(!merchant||String(row.merchantName||"").toLowerCase().includes(merchant))&&(!status||label===status)&&(!risk||riskLabel===risk)&&(!manual||(manual==="yes"?!!row.manualReviewRequired:!row.manualReviewRequired));
  });
  paintReviewQueue(rows); return rows;
}
function resetReviewFilters(){["rqSearch","rqMerchantFilter"].forEach(id=>{const e=document.getElementById(id);if(e)e.value="";});["rqStatusFilter","rqRiskFilter","rqManualFilter"].forEach(id=>{const e=document.getElementById(id);if(e)e.value="";});paintReviewQueue(CACHE.reviewQueue||[]);}
function paintReviewQueue(rows){
  const body=document.getElementById("rqBody");if(!body)return;
  const high=rows.filter(r=>reviewRiskLabel(r)[0]==="Élevé").length;
  ["rqToCheck","rqManual","rqRejected","rqPayment","rqHigh"].forEach(id=>{const e=document.getElementById(id);if(e)e.textContent="0";});
  const set=(id,n)=>{const e=document.getElementById(id);if(e)e.textContent=String(n);};
  set("rqToCheck",rows.filter(r=>r.manualReviewRequired||String(r.workflowStatus||"")==="MANUAL_REVIEW").length);
  set("rqManual",rows.filter(r=>String(r.workflowStatus||"")==="MANUAL_REVIEW").length);
  set("rqRejected",rows.filter(r=>String(r.workflowStatus||"")==="REJECTED").length);
  set("rqPayment",rows.filter(r=>["Prête pour paiement","Paiement autorisé"].includes(reviewWorkflowLabel(r))).length);set("rqHigh",high);
  const moneyValue=r=>r.finalCashbackAmount??r.cashbackAmount;
  if(!rows.length){body.innerHTML=`<tr><td colspan="9">${emptyMini("Aucune transaction à contrôler.")}</td></tr>`;return;}
  body.innerHTML=rows.map(r=>{const risk=reviewRiskLabel(r),camp=r.campaignName||(r.campaignId?"Campagne #"+r.campaignId:"Non disponible"),v=moneyValue(r);return `<tr><td class="mono">${esc(r.transactionRef||"Non renseigné")}</td><td class="mono">${esc(r.maskedCard||"Non renseigné")}</td><td>${esc(r.merchantName||"Non renseigné")}</td><td>${esc(camp)}</td><td>${v==null?"0 FCFA":esc(moneyWithCurrency(v,r.currency||"FCFA"))}${r.loyaltyBonusAmount!=null?`<div style="font-size:11px;color:var(--muted)">Bonus fidélité : ${esc(moneyWithCurrency(r.loyaltyBonusAmount,r.currency||"FCFA"))}</div>`:""}</td><td><span class="badge ${risk[1]}">${risk[0]}${r.fraudScore!=null?` · ${esc(r.fraudScore)}`:""}</span></td><td><span class="badge b-info">${esc(reviewWorkflowLabel(r))}</span></td><td style="max-width:210px;white-space:pre-wrap">${esc(r.lastWorkflowComment||r.rejectionReason||"Aucun motif renseigné")}</td><td class="row-actions"><button class="mini-btn" onclick="openTransactionWorkflow(${Number(r.id)||0})">Voir parcours</button></td></tr>`;}).join("");
}

function vouTypeBadge(t){
  const map = {
    PROGRESSIVE_LOYALTY: {label:"Fidélité progressive", cls:"b-info", icon:"•Z�"},
    ONE_SHOT: {label:"One-shot", cls:"b-ok", icon:"⚠"},

    BIRTHDAY: {label:"Anniversaire", cls:"b-warn", icon:"•Z,"},
    PARTNER_CAMPAIGN: {label:"Partenaire", cls:"b-muted", icon:"•"}
  };
  const m = map[t] || {label:t, cls:"b-muted", icon:"?"};
  return `<span class="badge ${m.cls}">${m.icon} ${m.label}</span>`;
}

function vouStatusBadge(s){
  const map = {
    ISSUED: {label:"Émis", cls:"b-info"},
    CONSUMED: {label:"Consommé", cls:"b-ok"},
    EXPIRED: {label:"Expiré", cls:"b-muted"},
    CANCELLED: {label:"Annulé", cls:"b-danger"}
  };
  const m = map[s] || {label:s, cls:"b-muted"};
  return `<span class="badge ${m.cls}">${m.label}</span>`;
}

function vouValueLabel(v){
  if(!v.valueType) return "—";
  if(v.valueType==="FREE_PRODUCT") return "•Z� Gratuit";
  if(v.valueType==="PERCENTAGE_DISCOUNT") return `${v.value||0} %`;
  return `${(v.value||0).toLocaleString("fr-FR")} FCFA`;
}
